const rx=w/2,ry=h-54;ctx.fillStyle='rgba(30,60,30,.55)';ctx.lineWidth=3;C(rx,ry,46);ctx.fill();ctx.stroke();
for(const e of ents){if(e.dead||e===me)continue;const dx=(e.x-me.x)/20,dy=(e.y-me.y)/20;if(Math.hypot(dx,dy)<42){ctx.fillStyle=TDM&&e.team===me.team?'#6cf':'#f55';C(rx+dx,ry+dy,3.5);ctx.fill()}}ctx.fillStyle='#ffd23f';C(rx,ry,4);ctx.fill();
ctx.setTransform(DPR,0,0,DPR,0,0);
if(me.hp<me.mh*.3&&!me.dead){const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.9);g.addColorStop(0,'rgba(200,0,0,0)');g.addColorStop(1,'rgba(200,0,0,'+(.25+.1*Math.sin(now/150))+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
if(me.dead){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 34px "Comic Sans MS",cursive';ctx.textAlign='center';ctx.fillText('Tu mar gaya! Respawn '+Math.ceil((me.rt-now)/1000),W/2,H/2)}
if(banner&&now<banner.e){ctx.font='bold 46px "Comic Sans MS",cursive';ctx.textAlign='center';ctx.strokeStyle=INK;ctx.lineWidth=7;ctx.strokeText(banner.t,W/2,H*.3);ctx.fillStyle='#ffd23f';ctx.fillText(banner.t,W/2,H*.3)}}
/* touch controls drawing (play + editor) */
const BL={jet:'JET',fire:'FIRE',g:'GRN',m:'HIT',s:'SWAP',r:'RLD',pause:'II'},BN={ls:'MOVE',rs:'AIM'};
function tui(ed){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.textAlign='center';ctx.font='bold 12px sans-serif';
for(const k of TK){const o=TL[k];if(!o.on&&!ed)continue;let[x,y]=ep(k);const R=er(k),stk=k==='ls'||k==='rs',st_=stk?T[k]:null;ctx.globalAlpha=o.on?Math.min(1,LY.op+(ed?.25:0)):.25;
if(stk){let bx_=x,by_=y;if(st_){bx_=st_.ox;by_=st_.oy}else if(!ed&&LY.sm==='float')ctx.globalAlpha*=.5;
ctx.fillStyle='rgba(255,255,255,.28)';C(bx_,by_,R);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.85)';C(bx_+(st_?st_.dx*R:0),by_+(st_?st_.dy*R:0),R*.42);ctx.fill();ctx.stroke();if(ed||!st_){ctx.fillStyle=INK;ctx.fillText(BN[k],bx_,by_+4)}}
else{const held=(T.hold[k]>0);ctx.fillStyle=held?'rgba(255,210,63,.95)':'rgba(255,255,255,.7)';C(x,y,R);ctx.fill();ctx.stroke();ctx.fillStyle=INK;ctx.font='bold '+(k==='pause'?14:12)+'px sans-serif';ctx.fillText(BL[k],x,y+4)}
ctx.globalAlpha=1;if(ed&&edSel===k){ctx.strokeStyle='#ffd23f';ctx.lineWidth=5;C(x,y,R+7);ctx.stroke();ctx.strokeStyle=INK;ctx.lineWidth=3}}
ctx.globalAlpha=1;if(ed){ctx.fillStyle='rgba(30,30,30,.7)';ctx.font='bold 14px sans-serif';ctx.fillText('Kisi bhi button/stick ko pakad ke drag karo • upar se size, hide/show aur opacity badlo',W/2,H-16)}}
/* ---------- screens / UI ---------- */
const OV=()=>$('ov');

function fs(){const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}try{screen.orientation.lock('landscape')}catch(e){}}

function showMenu(){mkCard('mn').innerHTML=`<div class="cg" style="align-items:center"><div style="width:160px"><canvas id="hv" width="150" height="220" class="pvc"></canvas><div class="perks">★ HERO ★<br>${HERO.hp} HP · +${Math.round((HERO.dmg-1)*100)}% DMG<br>Fast · Life-steal · Armor</div></div><div class="opts"><h1>DOODLE ARMY</h1><p class="sub">Jetpack Arena Shooter</p><div class="coinchip">🪙 ${SV.coins}</div><button class="big" onclick="plp()">▶ PLAY</button><div class="g2"><button class="grn" onclick="shop()">🛒 Shop</button><button onclick="cz();show('cz')">🎨 Customize</button><button onclick="st();show('st')">⚙ Settings</button><button onclick="fs()">⛶ Fullscreen</button></div></div></div>`;show('mn')}
function plp(){const ob=(k,l,v)=>l.map((x,i)=>`<button class="o${sel[k]===v[i]?' on':''}" onclick="sel.${k}=${v[i]};plp()">${x}</button>`).join('');

function pause(){if(state!=='play')return;state='pause';T.ls=T.rs=null;T.hold={};T.ids={};try{document.exitPointerLock()}catch(e){}mkCard('ps').innerHTML=`<h1>PAUSED</h1><div class="coinchip">🪙 ${SV.coins}</div><button class="big" onclick="resume()">▶ Resume</button><button class="big grn" onclick="shop()">🛒 Shop</button><button class="big" style="background:var(--gold)" onclick="start(TDM)">↻ Restart</button><div><button class="o" onclick="st();show('st')">Settings</button><button class="o" onclick="cz();show('cz')">Customize</button><button class="o" onclick="location.reload()">Quit</button></div>`;show('ps')}
function resume(){state='play';OV().style.display='none';if(set.lock&&!isTouch)try{cv.requestPointerLock()}catch(e){}}
/* settings */
function st(){const tg=(k,l,d)=>`<div class="row"><div class="rl"><b>${l}</b><small>${d}</small></div><button class="tg${set[k]?' on':''}" onclick="set.${k}=+!set.${k};ssv();st()">${set[k]?'ON':'OFF'}</button></div>`;
const seg=(cur,arr,fn)=>arr.map(a=>`<button class="o${cur===a[0]?' on':''}" onclick="${fn}'${a[0]}');st()">${a[1]}</button>`).join('');
const tabs=['Gameplay','PC Keys','Touch'];let b='';
if(stT==0)b=tg('lock','Mouse Lock','Mouse hilane se nishana ghoomta hai (PC)')+tg('auto','Auto Fire','Crosshair dushman par aate hi goli')+tg('assist','Aim Assist','Mobile: dushman ke paas nishana khud adjust')+tg('snd','Sound','Effects + voice callouts')+tg('shake','Screen Shake','Explosion / hit par kaampna')+`<div class="row"><div class="rl"><b>Mouse Sensitivity</b></div><span><input type="range" min="0.4" max="3" step="0.1" value="${set.sens}" oninput="set.sens=+this.value;$('sv').textContent=set.sens" onchange="ssv()"> <span id="sv">${set.sens}</span></span></div>`;
else if(stT==1)b=Object.keys(KL).map(a=>`<div class="row"><b>${KL[a]}</b><span>${[0,1].map(i=>{const on=listen&&listen.a===a&&listen.i===i;return `<button class="kb${on?' lis':''}" onclick="kbl('${a}',${i})">${on?'press key…':kn(KB[a][i])}</button>`}).join('')}</span></div>`).join('')+`<p>Slot par click karo, phir naya key dabao. Backspace = slot khali. Esc = cancel.</p><button onclick="kbr()">Reset keys</button>`;
else b=`<div class="row"><b>Stick style</b><span>${seg(LY.sm,[['float','Floating'],['fixed','Fixed']],'LY.sm=')}</span></div><div class="row"><b>Fire mode</b><span>${seg(LY.fm,[['edge','Stick edge'],['button','Button'],['both','Both']],'LY.fm=')}</span></div><div class="row"><b>Opacity</b><input type="range" min="0.2" max="1" step="0.05" value="${LY.op}" oninput="LY.op=+this.value" onchange="lsave()"></div><button class="big" onclick="edit()">🎛 Edit button layout</button><button onclick="lreset();st()">Reset layout</button><p>Layout editor me har button ko apni jagah drag karo, size badlo, ya chhupa do. Right thumb stick = nishana, kinare tak dhakelo = fire.</p>`;
mkCard('st').innerHTML=`<h1>Settings</h1><div class="tabs">${tabs.map((t,i)=>`<button class="o${stT==i?' on':''}" onclick="listen=null;stT=${i};st()">${t}</button>`).join('')}</div><div class="shb">${b}</div><button class="big" onclick="listen=null;back()">Back</button>`;
if(stT==2)document.querySelectorAll('#st .o').forEach(()=>{})}
function kbl(a,i){listen={a,i};st()}
function kbr(){for(const a in KD)KB[a]=KD[a].slice();sv_('dakb',KB);st()}
/* layout editor */
function edit(){edPrev=state;state='edit';OV().style.display='none';$('eb').style.display='flex';edSel=null;ebr()}
function ebr(){const k=edSel,o=k&&TL[k],nm={ls:'Move stick',rs:'Aim stick',jet:'Jetpack',fire:'Fire',g:'Grenade',m:'Punch',s:'Swap gun',r:'Reload',pause:'Pause'};
$('eb').innerHTML=`<b>${k?nm[k]:'Control chuno'}</b>${k?`Size <input type="range" min=".5" max="1.8" step=".05" value="${o.z}" oninput="TL['${k}'].z=+this.value" onchange="lsave()"><button onclick="TL['${k}'].on=+!TL['${k}'].on;lsave();ebr()">${o.on?'Hide':'Show'}</button>`:''} Opacity <input type="range" min=".2" max="1" step=".05" value="${LY.op}" oninput="LY.op=+this.value" onchange="lsave()"><button onclick="LY.sm=LY.sm==='float'?'fixed':'float';lsave();ebr()">Stick: ${LY.sm==='float'?'Floating':'Fixed'}</button><button onclick="lreset();ebr()">Reset</button><button class="grn" onclick="edDone()">✔ Done</button>`}
function edDone(){lsave();$('eb').style.display='none';state=edPrev;stT=2;st();show('st')}
/* customize */
function cz(){const sw=(k,a)=>a.map(v=>`<span class="sw${cfg[k]===v?' on':''}" style="background:${v}" onclick="cfg.${k}='${v}';cz()"></span>`).join(''),op=(k,a)=>a.map((v,i)=>`<button class="o${cfg[k]===i?' on':''}" onclick="cfg.${k}=${i};cz()">${v}</button>`).join(''),
wp=k=>WP.map((w,i)=>SV.own[i]?`<div class="wc${cfg[k]===i?' on':''}" onclick="cfg.${k}=${i};cz()"><img src="${wicon(i)}" width="54" alt=""><small>${w.n.split(' ')[0]}</small></div>`:`<div class="wc lock"><img src="${wicon(i)}" width="54" alt=""><small>🔒 Shop</small></div>`).join('');
mkCard('cz').innerHTML=`<h1>Customize</h1><div class="cg"><div style="width:180px"><canvas id="pv" width="180" height="230" class="pvc"></canvas><input id="pn" maxlength="10" placeholder="Player name" value="${cfg.name||''}" oninput="cfg.name=this.value"></div><div class="opts"><div class="row"><b>Armor</b><span>${sw('col',COLS)}</span></div><div class="row"><b>Skin</b><span>${sw('skin',SKIN)}</span></div><div class="row"><b>Jetpack</b><span>${sw('jet',JET)}</span></div><div class="row"><b>Cape</b><span>${sw('cape',CAPES)}</span></div><div class="row"><b>Face</b><span>${op('face',['Clean','Beard','Mask','Goggles'])}</span></div><div class="row"><b>Helmet</b><span>${op('hat',['Army','Cap','Beanie'])}</span></div><div class="row"><b>Primary</b></div><div class="wg">${wp('w0')}</div><div class="row"><b>Secondary</b></div><div class="wg">${wp('w1')}</div></div></div><button class="big" id="cb">Save</button>`;
pvDraw('pv',myLook(),2.9);
$('cb').onclick=()=>{sv_('dacfg',cfg);if(state==='pause'&&ents)Object.assign(ents[0],{col:TDM?ents[0].col:cfg.col,skin:cfg.skin,face:cfg.face,hat:cfg.hat,jet:cfg.jet,cape:cfg.cape,name:cfg.name||'You'});back()}}
/* shop */
const pips=(n,m)=>Array.from({length:m},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join(''),bar=(l,v,c)=>`<div class="bl"><span>${l}</span><div class="bt"><div style="width:${v}%;background:${c}"></div></div></div>`;
function eqw(s,i){cfg['w'+s]=i;sv_('dacfg',cfg);shop()}
function buy(k,i){let c=0;if(k==0)c=WUN[i];else if(k==1)c=WB[i]*(SV.wl[i]+1);else if(k==2)c=CH[i][4]*(SV[CH[i][0]]+1);else c=ARP[i];
if(SV.coins<c){shMsg='Coins kam hain!';shop();return}
SV.coins-=c;if(k==0)SV.own[i]=1;else if(k==1)SV.wl[i]++;else if(k==2)SV[CH[i][0]]++;else{SV.ar=i;shPv=i;if(ents&&ents[0])ents[0].ar=i}sv();snd(800,.15,'triangle',.1);shop()}
function shop(){const T_=['🔫 Weapons','🦸 Hero','🛡 Armor'];let b='';
if(shT==0)b='<div class="sg">'+WP.map((w,i)=>{const lv=SV.wl[i],own=SV.own[i],S_=WS[i];return `<div class="sc${own?'':' lk'}"><img src="${wicon(i)}" class="si" alt=""><div class="sn">${w.n}${own?'':' 🔒'}</div>${bar('Power',Math.min(100,S_[0]*(1+.1*lv)),'#e5533d')}${bar('Rate',S_[1],'#e0a526')}${bar('Range',S_[2],'#3b82c4')}<div class="pips">${pips(lv,5)}</div>${own?`<div class="eq"><button class="o${cfg.w0===i?' on':''}" onclick="eqw(0,${i})">Primary</button><button class="o${cfg.w1===i?' on':''}" onclick="eqw(1,${i})">Secondary</button></div>`:''}${own?(lv<5?`<button class="buy" onclick="buy(1,${i})">⬆ Upgrade +10% dmg <span class="pr">🪙${WB[i]*(lv+1)}</span></button>`:'<div class="mx">★ MAX ★</div>'):`<button class="buy" style="background:var(--org)" onclick="buy(0,${i})">Unlock <span class="pr">🪙${WUN[i]}</span></button>`}</div>`}).join('')+'</div>';
else if(shT==1)b=`<div class="perk">★ HERO PERKS (free): ${HERO.hp} base HP · +${Math.round((HERO.dmg-1)*100)}% damage · +${Math.round((HERO.spd-1)*100)}% speed · ${Math.round((1-HERO.rl)*100)}% faster reload · ${Math.round((1-HERO.fuel)*100)}% less fuel use · +${HERO.kh} HP per kill · extra armor · faster regen</div>`+CH.map((c,i)=>{const lv=SV[c[0]];return `<div class="hr"><span class="ic">${c[1]}</span><div class="in"><b>${c[2]}</b><small>${c[3]} per level</small><div class="pips" style="justify-content:flex-start">${pips(lv,5)}</div></div>${lv<5?`<button class="buy" style="width:auto" onclick="buy(2,${i})">Upgrade <span class="pr">🪙${c[4]*(lv+1)}</span></button>`:'<span class="mx">★ MAX ★</span>'}</div>`}).join('');
else b=`<div class="cg"><canvas id="sp" width="150" height="220" class="pvc"></canvas><div class="al">${[1,2,3,4].map(t=>`<div class="hr" onclick="shPv=${t};shop()"><div class="in"><b>${ARN[t]}</b><small>-${Math.round(ARR[t]*100)}% damage taken</small></div>${SV.ar>=t?`<span class="mx">${SV.ar==t?'EQUIPPED':'OWNED'}</span>`:SV.ar==t-1?`<button class="buy" style="width:auto" onclick="event.stopPropagation();buy(3,${t})">Buy <span class="pr">🪙${ARP[t]}</span></button>`:'<span>🔒</span>'}</div>`).join('')}</div></div>`;
mkCard('sh').innerHTML=`<h1>Shop</h1><div class="coinchip">🪙 ${SV.coins}</div> <span style="color:#d6402b;font-size:14px">${shMsg}</span><div class="tabs">${T_.map((t,i)=>`<button class="o${shT==i?' on':''}" style="font-size:15px" onclick="shT=${i};shop()">${t}</button>`).join('')}</div><div class="shb">${b}</div><button class="big" onclick="back()">Back</button>`;shMsg='';show('sh');
if(shT==2)pvDraw('sp',myLook({ar:shPv}),2.4)}
/* match end */
function end(){state='end';T.ls=T.rs=null;T.hold={};try{document.exitPointerLock()}catch(e){}const me=ents[0],l=[...ents].sort((a,b)=>b.kills-a.kills);let win=0,h='<h1>Match Over!</h1>';
if(TDM){const a=tk(0),b=tk(1);win=a==b?.5:((me.team==0)==(a>b))?1:0;h+='<p><b>'+(a==b?'Draw!':a>b?'Blue Team jeeta!':'Red Team jeeta!')+'</b></p>'}else{win=l[0]===me?1:0;h+='<p><b>'+l[0].name+' jeeta!</b></p>'}
const wb=win==1?(TDM?120:150):win==.5?60:0,sb=!TDM&&l[1]===me?50:0,tot=30+wb+sb;SV.coins+=tot;sv();
h+=`<div class="hr"><div class="in"><b>Rewards</b><small>Kills: 🪙${mEarn} | Participation: 🪙30${wb?' | Win bonus: 🪙'+wb:''}${sb?' | 2nd place: 🪙'+sb:''}</small></div></div><div class="coinchip">Total earned: 🪙${mEarn+tot}</div>`;
h+='<table>'+l.map(e=>'<tr><td>'+(e.hero?'★ ':'')+e.name+'</td><td>'+e.kills+' kills</td><td>'+e.deaths+' deaths</td></tr>').join('')+'</table><button class="big" onclick="start(TDM)">Play again</button><button class="o" onclick="shop()">Shop</button><button class="o" onclick="location.reload()">Main Menu</button>';mkCard('en').innerHTML=h;show('en')}
function earn(n){SV.coins+=n;mEarn+=n;gain={n,e:now+1200};sv()}
/* ---------- main loop ---------- */
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000);last=t;if(state!=='pause')now+=dt*1000;
if(state==='menu'||state==='edit'||!ents){cam.x+=dt*25;drawBG();if(state==='edit')tui(true);else pvDraw('hv',myLook({aim:.15+Math.sin(now/700)*.12,hero:1}),2.6);return}
if(state==='play'){for(const e of ents)upd(e,dt);updWorld(dt);if(now>tEnd)end()}else for(const e of ents)if(e.bot)e.in={mx:0};
const me=ents[0],z=WP[me.w[me.slot].i].z?.68:1;zoom+=(z-zoom)*Math.min(1,2*dt);S=H/(H<520?520:680)*zoom;
const vw=W/S,vh=H/S;let tx=me.x-vw/2+Math.cos(me.aim)*60,ty=me.y-vh/2-40+Math.sin(me.aim)*40;
tx=Math.max(-40,Math.min(WW+40-vw,tx));ty=Math.max(-40,Math.min(WH-vh,ty));if(vw>WW)tx=(WW-vw)/2;if(vh>WH)ty=(WH-vh)/2;
cam.x+=(tx-cam.x)*Math.min(1,6*dt);cam.y+=(ty-cam.y)*Math.min(1,6*dt);shake*=.9;draw()}
showMenu();requestAnimationFrame(loop);
</script></body></html>
